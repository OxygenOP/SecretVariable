# Run SecretVariable with PostgreSQL:
#   export SV_MASTER_KEY=$(openssl rand -hex 32)   # keep this safe: without it the data cannot be decrypted
#   docker compose up -d
# Then open http://localhost:8080
services:
  app:
    build: .
    image: secretvariable:latest
    restart: unless-stopped
    ports:
      - "${SV_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://secretvariable:${POSTGRES_PASSWORD:-secretvariable}@db:5432/secretvariable
      SV_MASTER_KEY: ${SV_MASTER_KEY:?Set SV_MASTER_KEY, e.g. export SV_MASTER_KEY=$(openssl rand -hex 32)}
      SV_ALLOW_REGISTRATION: ${SV_ALLOW_REGISTRATION:-true}
      SV_SMTP_URL: ${SV_SMTP_URL:-}
      SV_MAIL_FROM: ${SV_MAIL_FROM:-SecretVariable <no-reply@localhost>}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: secretvariable
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretvariable}
      POSTGRES_DB: secretvariable
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretvariable"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
